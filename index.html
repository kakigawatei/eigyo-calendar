<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="営業カレンダー">
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>営業カレンダー｜アブララボ</title>
<style>
  :root{
    --bg:#f4f1ea; --ink:#2b2b2b; --sub:#7a756c; --line:#dcd6c8;
    --brand:#2f6f5e; --orange:#c1121f; --satblue:#1565c0; --satfill:#d4e9fb; --gridline:#000000; --paper:#ffffff;
    --sat:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
  .toolbar{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:calc(var(--sat) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
  .toolbar .mnav{display:flex;align-items:center;gap:14px;font-weight:800;font-size:16px;}
  .toolbar button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;}
  .toolbar button.act{background:#fff;color:var(--brand);}
  .toolbar .arw{background:rgba(255,255,255,.16);width:38px;height:38px;border-radius:10px;font-size:20px;}
  .hint{max-width:1100px;margin:12px auto 0;padding:0 14px;color:var(--sub);font-size:13px;text-align:center;}
  .wrap{padding:14px;display:flex;justify-content:center;}

  /* ---- poster ---- モバイルファースト（縦・編集しやすい）／広い画面と印刷は横A4 ---- */
  .poster{background:var(--paper);width:100%;max-width:1100px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.06);}
  .left{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .mblock{display:flex;align-items:baseline;gap:8px;}
  .mnum{font-size:46px;font-weight:800;line-height:.9;letter-spacing:-.02em;}
  .men{font-size:13px;color:var(--sub);font-weight:600;}
  .logoimg{height:52px;width:auto;display:block;}
  .note{flex-basis:100%;font-size:11px;color:var(--sub);line-height:1.6;}
  .right{flex:1;display:flex;flex-direction:column;}
  .whead{display:grid;grid-template-columns:repeat(7,1fr);}
  .whead div{text-align:center;font-weight:700;font-size:12px;color:var(--sub);padding:7px 0;}
  .whead div:nth-child(6){color:var(--satblue);font-weight:800;background:var(--satfill);}
  .grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);}
  .cell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px 2px;position:relative;cursor:pointer;min-height:66px;display:flex;flex-direction:column;transition:background .15s;}
  .cell:nth-child(7n){border-right:0;}
  .cell.sat{background:var(--satfill);}
  .cell.blank{cursor:default;}
  .cell .dnum{font-size:11px;font-weight:700;color:#555;}
  .cell .dnum .hol{color:var(--orange);font-weight:700;font-size:.78em;display:block;}
  .cell .body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1px;}
  .cell .hours{font-size:9.5px;color:#333;line-height:1.25;}
  .cell .closed{font-size:12px;font-weight:800;color:var(--orange);}
  .cell .eve{font-size:9.5px;font-weight:800;color:var(--orange);}
  .hf{display:none;} .hm{display:inline;}
  .cell:active{background:#f0ece0;}
  @media(min-width:640px){
    .poster{flex-direction:row;aspect-ratio:1.414/1;}
    .left{width:24%;min-width:150px;flex-direction:column;align-items:flex-start;border-bottom:0;border-right:1px solid var(--line);padding:3% 2.4%;}
    .mblock{flex-direction:column;align-items:flex-start;gap:4px;}
    .mnum{font-size:clamp(40px,6.5vw,84px);} .men{font-size:clamp(11px,1.3vw,16px);}
    .logoimg{width:88%;height:auto;margin-top:8%;}
    .note{flex-basis:auto;margin-top:auto;font-size:clamp(9px,1vw,12px);line-height:1.7;}
    .whead div{font-size:clamp(10px,1.2vw,14px);}
    .cell{padding:5px 5px 3px;min-height:0;}
    .cell .dnum{font-size:clamp(10px,1.15vw,14px);}
    .cell .dnum .hol{display:inline;margin-left:4px;}
    .cell .hours{font-size:clamp(9px,1.02vw,12.5px);line-height:1.35;}
    .cell .closed{font-size:clamp(11px,1.35vw,16px);}
    .cell .eve{font-size:clamp(9px,1.02vw,12.5px);}
    .hf{display:inline;} .hm{display:none;}
  }

  .modal{position:fixed;inset:0;background:rgba(20,20,18,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .modal.on{display:flex;}
  .modal .box{background:var(--paper);border-radius:18px;padding:20px 18px;width:100%;max-width:420px;max-height:82vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease;}
  @keyframes pop{from{opacity:0;transform:scale(.96)} to{opacity:1;transform:none}}
  @media(max-width:600px){ .modal{align-items:flex-end;padding:0;} .modal .box{border-radius:20px 20px 0 0;max-width:600px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0));} }
  .modal h3{margin:0 0 14px;font-size:17px;}
  .hin{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-top:4px;font-family:inherit;box-sizing:border-box;}
  .opt{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:8px;}
  .opt .sw{width:16px;height:16px;border-radius:50%;background:var(--line);}
  .opt.營業 .sw,.opt.op-open .sw{background:var(--brand);}
  .opt.op-eve .sw{background:var(--orange);}
  .opt.op-holiday .sw,.opt.op-closed .sw{background:var(--orange);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2a28;color:#fff;padding:11px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:80;}
  .toast.on{opacity:.95;}

  @media print{
    /* iOSは用紙向き指定を無視するため、内容を90°回して"横A4"で刷る（PC/スマホ共通） */
    @page{size:A4 portrait;margin:0;}
    html,body{background:#fff!important;margin:0!important;padding:0!important;width:210mm!important;height:297mm!important;overflow:hidden!important;}
    #app{height:auto!important;overflow:visible!important;display:block!important;}
    .toolbar,.hint,.toast,nav{display:none !important;}
    .wrap{padding:0!important;margin:0!important;height:0!important;overflow:visible!important;}
    .poster{box-shadow:none!important;border:none!important;border-radius:0!important;box-sizing:border-box!important;
      width:297mm!important;height:210mm!important;flex-direction:row !important;aspect-ratio:auto!important;
      position:absolute!important;top:0!important;left:0!important;
      transform-origin:top left!important;transform:translateX(210mm) rotate(90deg)!important;}
    .left{width:23%!important;flex-direction:column !important;align-items:flex-start !important;border-bottom:0 !important;border-right:2px solid var(--gridline) !important;padding:10mm 6mm !important;}
    .mblock{flex-direction:column !important;align-items:flex-start !important;gap:4px !important;}
    .mnum{font-size:58px !important;} .men{font-size:13px !important;}
    .logoimg{width:80% !important;height:auto !important;margin-top:14px !important;}
    .note{flex-basis:auto !important;margin-top:9mm !important;font-size:15px !important;line-height:1.95 !important;color:#333 !important;font-weight:600 !important;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    .whead{border-top:2px solid var(--gridline) !important;border-right:2px solid var(--gridline) !important;}
    .whead div{font-size:15px !important;font-weight:800 !important;color:#333 !important;padding:7px 0 !important;border-bottom:2px solid var(--gridline) !important;border-left:1.6px solid var(--gridline) !important;}
    .whead div:first-child{border-left:0 !important;}
    .whead div:nth-child(6){color:var(--satblue) !important;}
    .grid{border-right:2px solid var(--gridline) !important;border-bottom:2px solid var(--gridline) !important;grid-auto-rows:1fr !important;height:100% !important;}
    .grid .cell{min-height:0 !important;padding:5px 4px !important;border-top:1.6px solid var(--gridline) !important;border-left:1.6px solid var(--gridline) !important;}
    .cell:nth-child(7n){border-right:0 !important;}
    .cell .dnum{font-size:15px !important;font-weight:800 !important;color:#333 !important;} .cell .dnum .hol{display:inline !important;margin-left:4px;font-size:.72em;}
    .cell .hours{font-size:13.5px !important;line-height:1.45 !important;font-weight:600 !important;color:#1a1a1a !important;} .cell .closed{font-size:19px !important;font-weight:900 !important;} .cell .eve{font-size:13px !important;font-weight:800 !important;}
    .hf{display:inline !important;} .hm{display:none !important;}
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="mnav"><button class="arw" onclick="chMonth(-1)">‹</button><span id="mlabel"></span><button class="arw" onclick="chMonth(1)">›</button></div>
    <button onclick="resetMonth()">デフォルトに戻す</button>
    <button class="act" onclick="window.print()">🖨 印刷</button>
    <span id="calsync" style="font-size:11px;opacity:.85">…</span>
  </div>
  <div class="hint">各日をタップ → 営業／夕方休業／休業／定休日 を選べます。基本は月・水・金・土が営業。変更したい日だけ直して「印刷」。</div>
  <div class="wrap"><div class="poster" id="poster"></div></div>
  <div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
  <div class="toast" id="toast"></div>

<script>
/* 営業カレンダー（アブララボ）Phase1 — localStorage・印刷対応 */
var WD=["日","月","火","水","木","金","土"];
var HEAD=["月","火","水","木","金","土","日"]; // 月曜始まり
var MONTH_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var LUNCH="11:00〜14:00", DINNER="17:00〜20:00";
function abbr(h){ return (h||"").replace(/:00/g,"").replace("〜","-"); }
function hoursFM(full){ return '<div class="hours"><span class="hf">'+full+'</span><span class="hm">'+abbr(full)+'</span></div>'; }
// デフォルト曜日パターン：月(1)水(3)金(5)土(6)=営業／火(2)木(4)日(0)=定休日
function defaultStatus(dow){ return (dow===1||dow===3||dow===5||dow===6) ? "open" : "holiday"; }

var now=new Date();
var Y=now.getFullYear(), M=now.getMonth(); // 表示中の年・月(0始)
function keyOf(y,m){ return "eigyocal_"+y+"-"+(m+1); }
function load(y,m){ try{var v=localStorage.getItem(keyOf(y,m));return v?JSON.parse(v):{days:{}};}catch(e){return {days:{}};} }
function save(y,m,d){ try{localStorage.setItem(keyOf(y,m),JSON.stringify(d));}catch(e){} cloudPush(y,m); }
var data=load(Y,M);

/* ---------- クラウド同期（Firebase kakigawatei-franchise・shime_docsルール流用でmasa追加設定不要） ---------- */
var FB={apiKey:"AIzaSyDtDZIEQtBzjujnpTDcXt1QeEU2r-wbg74",projectId:"kakigawatei-franchise"};
var fbTok=null,fbExp=0,pushT={};
function fbAnon(){return fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({returnSecureToken:true})}).then(function(x){if(!x.ok)throw 0;return x.json();}).then(function(d){fbTok=d.idToken;fbExp=Date.now()+(parseInt(d.expiresIn,10)-60)*1000;try{localStorage.setItem("eigyocal_fb_refresh",d.refreshToken);}catch(e){}return fbTok;});}
function fbAuth(){if(fbTok&&Date.now()<fbExp)return Promise.resolve(fbTok);var r=null;try{r=localStorage.getItem("eigyocal_fb_refresh");}catch(e){}
  if(r)return fetch("https://securetoken.googleapis.com/v1/token?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(r)}).then(function(x){if(!x.ok)throw 0;return x.json();}).then(function(d){fbTok=d.id_token;fbExp=Date.now()+(parseInt(d.expires_in,10)-60)*1000;return fbTok;}).catch(fbAnon);
  return fbAnon();}
function docId(y,m){return "cal_"+y+"-"+(m+1);}
function fsUrl(id){return "https://firestore.googleapis.com/v1/projects/"+FB.projectId+"/databases/(default)/documents/shime_docs/"+id;}
function cloudPush(y,m){ var id=docId(y,m); setCalSync("同期中…"); clearTimeout(pushT[id]); pushT[id]=setTimeout(function(){ var v=localStorage.getItem(keyOf(y,m))||JSON.stringify({days:{}});
  fbAuth().then(function(t){return fetch(fsUrl(id)+"?updateMask.fieldPaths=json&updateMask.fieldPaths=ts",{method:"PATCH",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({fields:{json:{stringValue:v},ts:{integerValue:String(Date.now())}}})});}).then(function(r){if(!r.ok)throw 0;setCalSync("同期済");}).catch(function(){setCalSync("後で同期");}); },700); }
function cloudPull(y,m){ var id=docId(y,m); setCalSync("同期中…");
  return fbAuth().then(function(t){return fetch(fsUrl(id),{headers:{Authorization:"Bearer "+t}});}).then(function(r){if(r.status===404)return null;if(!r.ok)throw 0;return r.json();}).then(function(d){
    var js=(d&&d.fields&&d.fields.json)?d.fields.json.stringValue:null;
    if(js===null){ var local=localStorage.getItem(keyOf(y,m)); if(local){ cloudPush(y,m); } else { setCalSync("同期済"); } return; }
    var cur=localStorage.getItem(keyOf(y,m));
    if(cur!==js){ try{localStorage.setItem(keyOf(y,m),js);}catch(e){} if(y===Y&&m===M){ data=load(Y,M); render(); } }
    setCalSync("同期済");
  }).catch(function(){ setCalSync("オフライン"); }); }
function setCalSync(t){ var e=el("calsync"); if(e)e.textContent=t; }

function el(id){return document.getElementById(id);}
function toast(m){var t=el("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on");},1400);}

function statusOf(day){ // returns {type, ...}
  var ov=data.days[day];
  var dow=new Date(Y,M,day).getDay();
  var type = ov && ov.status ? ov.status : defaultStatus(dow);
  return type;
}
function render(){
  el("mlabel").textContent=Y+"年"+(M+1)+"月";
  var first=new Date(Y,M,1); var startDow=(first.getDay()+6)%7; // 月曜始まりの先頭空白数
  var dim=new Date(Y,M+1,0).getDate();
  var cells="";
  for(var i=0;i<startDow;i++) cells+='<div class="cell blank'+(i===5?' sat':'')+'"></div>';
  for(var day=1;day<=dim;day++){
    var dow=new Date(Y,M,day).getDay();
    var isSat=(dow===6);
    var ov=data.days[day]||{};
    var st=statusOf(day);
    var body="";
    if(st==="custom"){ var L=""; if(ov.lunch)L+=hoursFM(ov.lunch); if(ov.dinner)L+=hoursFM(ov.dinner); body=L||'<div class="closed">休業</div>'; }
    else if(st==="open") body=hoursFM(LUNCH)+hoursFM(DINNER);
    else if(st==="eve") body=hoursFM(LUNCH)+'<div class="eve"><span class="hf">夕方休業</span><span class="hm">夜休</span></div>';
    else if(st==="noon") body='<div class="eve"><span class="hf">昼休業</span><span class="hm">昼休</span></div>'+hoursFM(DINNER);
    else if(st==="closed") body='<div class="closed">休業</div>';
    else body='<div class="closed">定休日</div>';
    cells+='<div class="cell'+(isSat?' sat':'')+'" onclick="pick('+day+')"><div class="dnum">'+day+'</div><div class="body">'+body+'</div></div>';
  }
  var trail=(7-((startDow+dim)%7))%7; // 月末の後を空マスで埋めて最終週も四角に
  for(var t=0;t<trail;t++){ var col=(startDow+dim+t)%7; cells+='<div class="cell blank'+(col===5?' sat':'')+'"></div>'; }
  var poster='<div class="left"><div class="mblock"><div class="mnum">'+("0"+(M+1)).slice(-2)+'</div><div class="men">'+MONTH_EN[M]+' '+Y+'</div></div>'
    +'<img class="logoimg" src="assets/logo.png" alt="アブララボ">'
    +'<div class="note">不定期に休業することがあります。営業日の変更がありましたら googleMAP・instagram などでお伝えします。</div></div>'
    +'<div class="right"><div class="whead">'+HEAD.map(function(w){return '<div>'+w+'</div>';}).join("")+'</div><div class="grid">'+cells+'</div></div>';
  el("poster").innerHTML=poster;
}
function pick(day){
  var cur=statusOf(day);
  function opt(v,label,cls){return '<button class="opt '+cls+(cur===v?' ':'')+'" onclick="setDay('+day+',\''+v+'\')"><span class="sw"></span>'+label+(cur===v?' ✓':'')+'</button>';}
  openModal('<h3>'+(M+1)+'/'+day+'（'+WD[new Date(Y,M,day).getDay()]+'）</h3>'
    +opt("open","営業（11:00〜14:00・17:00〜20:00）","op-open")
    +opt("eve","夕方休業（昼のみ営業）","op-eve")
    +opt("noon","昼休業（夜のみ営業）","op-eve")
    +opt("closed","休業","op-closed")
    +opt("holiday","定休日","op-holiday")
    +'<button class="opt" onclick="editHours('+day+')"><span class="sw" style="background:var(--brand)"></span>時間を変更（カスタム）</button>'
    +'<button class="opt" style="justify-content:center;border-style:dashed" onclick="clearDay('+day+')">デフォルトに戻す（'+(defaultStatus(new Date(Y,M,day).getDay())==="open"?"営業":"定休日")+'）</button>');
}
function editHours(day){
  var ov=data.days[day]||{}; var st=statusOf(day);
  var lunch = st==="custom"?(ov.lunch||""):(st==="noon"?"":LUNCH);
  var dinner = st==="custom"?(ov.dinner||""):(st==="eve"?"":DINNER);
  openModal('<h3>'+(M+1)+'/'+day+' 時間を変更</h3>'
    +'<label style="font-size:13px;color:var(--sub)">昼の時間（空欄＝昼休み）</label><input id="h_lunch" class="hin" value="'+lunch+'" placeholder="例：11:00〜13:00">'
    +'<label style="font-size:13px;color:var(--sub);margin-top:10px;display:block">夜の時間（空欄＝夜休み）</label><input id="h_dinner" class="hin" value="'+dinner+'" placeholder="例：17:00〜20:00">'
    +'<button class="opt" style="justify-content:center;background:var(--brand);color:#fff;border:0;margin-top:14px" onclick="saveHours('+day+')">保存</button>'
    +'<button class="opt" style="justify-content:center;border-style:dashed" onclick="pick('+day+')">戻る</button>');
}
function saveHours(day){ var l=el("h_lunch").value.trim(), d=el("h_dinner").value.trim(); if(!l&&!d){ data.days[day]={status:"closed"}; } else { data.days[day]={status:"custom",lunch:l,dinner:d}; } save(Y,M,data); closeModal(); render(); }
function setDay(day,v){ data.days[day]={status:v}; save(Y,M,data); closeModal(); render(); }
function clearDay(day){ delete data.days[day]; save(Y,M,data); closeModal(); render(); }
function chMonth(delta){ M+=delta; if(M<0){M=11;Y--;} if(M>11){M=0;Y++;} data=load(Y,M); render(); cloudPull(Y,M); }
function resetMonth(){ if(!confirm("この月をデフォルト（月水金土=営業／火木日=定休日）に戻しますか？")) return; data={days:{}}; save(Y,M,data); render(); toast("デフォルトに戻しました"); }
function openModal(h){el("modalbox").innerHTML=h;el("modal").classList.add("on");}
function closeModal(){el("modal").classList.remove("on");}
el("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

render();
cloudPull(Y,M);
document.addEventListener("visibilitychange",function(){ if(!document.hidden&&!el("modal").classList.contains("on")) cloudPull(Y,M); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
